name: Publish Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release version
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $config.package.version
          $tag = "v$version"

          $releaseTags = gh release list `
            --repo Midwest-Diesel/inventory-desktop `
            --limit 10 `
            --json tagName `
            --jq '.[].tagName'

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to retrieve GitHub releases."
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT

          if (@($releaseTags) -contains $tag) {
            "SHOULD_PUBLISH=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Skipping publish."
          } else {
            "SHOULD_PUBLISH=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag does not exist. Publishing."
          }

      - name: Setup Node.js
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        run: npm ci

      - name: Configure Tauri signing key
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "myapp.key"
          [System.IO.File]::WriteAllText($keyPath, $env:TAURI_PRIVATE_KEY_SECRET)
          "TAURI_PRIVATE_KEY=$keyPath" >> $env:GITHUB_ENV
          "TAURI_KEY_PASSWORD=" >> $env:GITHUB_ENV

      - name: Build Tauri application
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        run: npm run tauri build

      - name: Update latest.json
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        id: release
        shell: pwsh
        run: |
          $version = "${{ steps.check.outputs.VERSION }}"
          $tag = "${{ steps.check.outputs.TAG }}"

          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $signatureFile = Join-Path $bundleDir "Inventory_${version}_x64-setup.nsis.zip.sig"
          $zipFile = Join-Path $bundleDir "Inventory_${version}_x64-setup.nsis.zip"
          $latestJson = "latest.json"

          if (!(Test-Path $signatureFile)) {
            throw "Signature file not found for version $version!"
          }

          if (!(Test-Path $zipFile)) {
            throw "Installer ZIP not found: $zipFile"
          }

          if (!(Test-Path $latestJson)) {
            throw "latest.json not found: $latestJson"
          }

          $signature = (Get-Content $signatureFile -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $downloadUrl = "https://github.com/Midwest-Diesel/inventory-desktop/releases/download/$tag/Inventory_${version}_x64-setup.nsis.zip"

          $latest = Get-Content $latestJson -Raw | ConvertFrom-Json
          $latest.version = $tag
          $latest.platforms.'windows-x86_64'.signature = $signature
          $latest.platforms.'windows-x86_64'.url = $downloadUrl
          $latest.pub_date = $pubDate

          $latest | ConvertTo-Json -Depth 100 | Set-Content $latestJson -Encoding utf8

          "ZIP_FILE=$zipFile" >> $env:GITHUB_OUTPUT
          "BUNDLE_DIR=$bundleDir" >> $env:GITHUB_OUTPUT

          Write-Host "latest.json updated with version $version."

      - name: Create GitHub Release and upload installer
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.check.outputs.TAG }}"
          $zipFile = "${{ steps.release.outputs.ZIP_FILE }}"

          gh release create $tag $zipFile `
            --repo Midwest-Diesel/inventory-desktop `
            --title $tag `
            --notes ""

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub Release $tag."
          }

      - name: Commit updated latest.json
        if: steps.check.outputs.SHOULD_PUBLISH == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json

          if (!(git diff --cached --quiet)) {
            git commit -m "Update latest.json for ${{ steps.check.outputs.TAG }}"
            git push origin "HEAD:main"
          }

      - name: Clean up bundle files
        if: always() && steps.check.outputs.SHOULD_PUBLISH == 'true'
        shell: pwsh
        env:
          BUNDLE_DIR: ${{ steps.release.outputs.BUNDLE_DIR }}
        run: |
          if ($env:BUNDLE_DIR -and (Test-Path $env:BUNDLE_DIR)) {
            Get-ChildItem $env:BUNDLE_DIR -Force |
              Remove-Item -Recurse -Force
          }
